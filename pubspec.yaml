name: gun_sayac
description: NextDay - habit day counter.
publish_to: "none"
version: 1.0.0+3

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  flutter_secure_storage: ^9.0.0
  intl: ^0.20.2
  path_provider: ^2.1.4
  path: ^1.9.0
  http: ^1.2.0
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  uuid: ^4.4.2
  web: ^1.1.1
  google_mobile_ads: ^5.2.0
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  config:
    enable-swift-package-manager: false
  generate: true
  uses-material-design: true
  assets:
    - assets/content/smoking/
    - assets/content/alcohol/
    - assets/content/drugs/
    - assets/content/masturbation/
    - assets/content/diet/
    - assets/content/sports/
    - assets/brand/

flutter_launcher_icons:
  remove_alpha_ios: true
  android: true
  ios: true
  image_path: assets/brand/nextday_icon.png
  adaptive_icon_background: "#FFFBF8"
  adaptive_icon_foreground: assets/brand/nextday_icon.png