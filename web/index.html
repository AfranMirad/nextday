<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="esnaf_finans_mobile">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Esnaf Finans</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      background: #0c1210;
    }
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      background: #0c1210;
      color: #a8a29e;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      z-index: 9999;
      transition: opacity 0.25s ease;
    }
    #loader.hide {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(45, 212, 191, 0.2);
      border-top-color: #2dd4bf;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loader" aria-live="polite">
    <div class="spinner" role="status"></div>
    <span>Yükleniyor…</span>
  </div>
  <script>
    (function () {
      function hide() {
        var el = document.getElementById("loader");
        if (!el) return;
        el.classList.add("hide");
        setTimeout(function () { el.remove(); }, 300);
      }
      window.addEventListener("flutter-first-frame", hide);
      // Yedek: framework gecikirse en fazla 30 sn sonra kaldır
      setTimeout(function () { if (document.getElementById("loader")) hide(); }, 30000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
